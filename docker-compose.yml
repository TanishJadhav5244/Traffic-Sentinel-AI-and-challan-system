version: '3.8'

services:
  traffic-sentinel-ui:
    build: .
    container_name: traffic_sentinel_ui
    ports:
      - "8501:8501"
    volumes:
      - ./violations:/app/violations
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0

  traffic-sentinel-api:
    build: .
    container_name: traffic_sentinel_api
    ports:
      - "8000:8000"
    volumes:
      - ./violations:/app/violations
      - ./config.yaml:/app/config.yaml
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000
