# Model configurations
models:
  # Path to the fine-tuned YOLOv8 model for helmet/rider/plate detection
  # If this file doesn't exist, the system automatically falls back to yolov8n.pt in demo mode
  detector_weights: "models/best_detector.pt"
  
  # Confidence thresholds
  confidence:
    rider: 0.35
    helmet: 0.40
    no_helmet: 0.35
    license_plate: 0.40

# OCR configurations
ocr:
  # Preferred engine: "easyocr" or "tesseract"
  default_engine: "easyocr"
  
  # Path to Tesseract executable on Windows
  # Update this if installed in a custom location
  tesseract_path: "C:\\Program Files\\Tesseract-OCR\\tesseract.exe"
  
  # Preprocessing toggles
  preprocessing:
    resize_factor: 2.0
    bilateral_filter: true
    adaptive_threshold: true
    deskew: true
  
  # Enhancer toggles (night-mode / low-light auto boost)
  enhancer:
    auto_low_light: true
    luminance_threshold: 85
    force_enhancement: false

  # Regex to filter/verify Indian plates (e.g., MH12AB1234 or DL3CAY1111)
  plate_regex: "^[A-Z]{2}[0-9]{1,2}[A-Z]{1,3}[0-9]{4}$"

# Logging & Storage configuration
storage:
  # CSV file where violations are logged
  csv_log_path: "violations/violations_log.csv"
  
  # Directory where cropped license plates and violator headshots are saved
  crop_dir: "violations/crops"

# RTO Lookup configuration
rto:
  # Mode: "api" (for real RTO API endpoint) or "demo" (explicit labeled demo registry)
  mode: "api"
  # API Endpoint URL (e.g., https://api.example-rto.com/v1/vehicle)
  api_url: ""
  # API Key / Authentication token
  api_key: ""
  # Timeout in seconds for HTTP requests
  timeout_seconds: 5.0
  # Opt-in demo fallback mode: if true, uses explicit labeled mock data when API key is missing
  demo_fallback: true

# Notification configurations
notifications:
  # Notification dispatch log file
  log_file: "violations/notification_log.json"

  # Email (SMTP) configuration
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: "sentinel-alerts@traffic-sentinel.ai"
    # App password (for Gmail, generate at https://myaccount.google.com/apppasswords)
    sender_password: ""

  # SMS Gateway configuration
  sms:
    # Provider: "demo" (default), "twilio", or "fast2sms"
    provider: "demo"
    # Log file for demo SMS gateway
    sms_log_file: "violations/sms_log.json"

    # Twilio credentials (only if provider is "twilio")
    account_sid: ""
    auth_token: ""
    from_number: ""

    # Fast2SMS credentials (only if provider is "fast2sms")
    api_key: ""
    sender_id: "TRFSNT"
    route: "dlt"

# Payment Gateway configuration
payment:
  # Provider: "demo" (default) or "razorpay"
  provider: "demo"
  
  # Default fine amount for helmet violations (INR)
  fine_amount: 1000
  
  # Razorpay credentials (only if provider is "razorpay")
  razorpay_key_id: ""
  razorpay_key_secret: ""
  
  # Payment receipt output directory
  receipt_dir: "violations/challans"

# Challan settings
challan:
  fine_amount: 1000
  payment_deadline_days: 15

# Demo settings
demo:
  # Auto-download demo weights if custom weights are missing
  use_demo_fallback: true
  sample_video_url: "https://raw.githubusercontent.com/intel-iot-devkit/sample-videos/master/person-bicycle-car-detection.mp4"
